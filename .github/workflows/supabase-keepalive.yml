# Lives in this public repo: Actions on the private lumiku repo do not start (billing). Public-repo runners are free.
# Keeps the free-plan Supabase project from pausing after a quiet week:
# one tiny database read every day. The key is the publishable key the app ships with.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row through the REST API
        env:
          URL: https://scfcdjbhwkqriuvupiby.supabase.co
          KEY: sb_publishable_4asfCcxXxHdBxY0_wYccGg_xz3RUrcX
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" "$URL/rest/v1/profiles?select=id&limit=1")
          echo "REST answered $code"
          if [ "$code" = 540 ] || [ "$code" -ge 500 ]; then
            echo "::error::Supabase did not answer normally (paused or down): $code"; exit 1
          fi
